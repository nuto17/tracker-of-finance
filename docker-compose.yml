version: '3.9'
name: finance-tracker

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8887:8888"
    env_file:
      - .env.docker
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: template-db
    restart: always
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}

volumes:
  db-data:


